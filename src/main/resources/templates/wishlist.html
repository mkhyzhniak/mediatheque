<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mediatheque — Wishlist</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/fragments :: header}"></div>
    <div th:replace="~{fragments/fragments :: nav('wishlist')}"></div>

    <div class="content">
        <div th:replace="~{fragments/fragments :: filters}"></div>

        <div th:if="${#lists.isEmpty(entries)}" class="empty-message">
            YOUR WISHLIST IS EMPTY.
        </div>

        <div class="grid" th:unless="${#lists.isEmpty(entries)}">
            <div th:each="entry : ${entries}" class="card">
                <div class="card-cover">
                    <div th:if="${entry.coverUrl != null}">
                        <img th:src="${entry.coverUrl}" alt="Cover">
                    </div>
                    <div th:if="${entry.coverUrl == null}" class="cover-placeholder">
                        <div class="cp-reel"><div class="cp-inner"></div></div>
                        <div class="cp-reel"><div class="cp-inner"></div></div>
                    </div>
                </div>
                <div class="card-bd">
                    <div class="card-title" th:text="${entry.albumTitle}"></div>
                    <div class="card-artist" th:text="${entry.artistName + (entry.year != null && entry.year != 0 ? ' · ' + entry.year : '')}"></div>
                    <div class="card-notes" th:text="${(entry.genre != null ? entry.genre : '') + (entry.label != null ? ' · ' + entry.label : '')}"></div>
                    <div class="card-fmt" th:text="${entry.format}"></div>
                    <div class="card-row">
                        <div class="card-date" th:text="${entry.addedDate}"></div>
                        <div></div>
                    </div>
                    <div class="card-acts">
                        <form th:action="@{'/' + ${entry.id} + '/move'}" method="post" class="form-inline">
                            <button type="submit" class="btn btn-success">+ COLLECTION</button>
                        </form>
                        <form th:action="@{'/' + ${entry.id} + '/delete'}" method="post" class="form-inline">
                            <button type="submit" class="btn btn-del">DELETE</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/fragments :: footer('WISHLIST')}"></div>
</div>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);

        const formats = params.getAll('format');
        document.querySelectorAll('#formatDropdown input[type=checkbox]').forEach(cb => {
            if (formats.includes(cb.value)) cb.checked = true;
        });
        if (formats.length > 0) {
            document.getElementById('formatLabel').textContent = formats.length + ' SELECTED';
        }

        const artists = params.getAll('artist');
        document.querySelectorAll('#artistDropdown input[type=checkbox]').forEach(cb => {
            if (artists.includes(cb.value)) cb.checked = true;
        });
        if (artists.length > 0) {
            document.getElementById('artistLabel').textContent = artists.length + ' SELECTED';
        }
    });

    function applyFilters() {
        const formats = [...document.querySelectorAll('#formatDropdown input:checked')].map(e => e.value);
        const artists = [...document.querySelectorAll('#artistDropdown input:checked')].map(e => e.value);
        const sort = document.getElementById('sortSelect').value;
        let url = '?sort=' + sort;
        formats.forEach(f => url += '&format=' + f);
        artists.forEach(a => url += '&artist=' + encodeURIComponent(a));
        window.location.href = url;
    }

    function resetFormat() {
        document.querySelectorAll('#formatDropdown input[type=checkbox]').forEach(cb => cb.checked = false);
        const sort = document.getElementById('sortSelect').value;
        const artists = [...document.querySelectorAll('#artistDropdown input:checked')].map(e => e.value);
        let url = '?sort=' + sort;
        artists.forEach(a => url += '&artist=' + encodeURIComponent(a));
        window.location.href = url;
    }

    function resetArtist() {
        document.querySelectorAll('#artistDropdown input[type=checkbox]').forEach(cb => cb.checked = false);
        const sort = document.getElementById('sortSelect').value;
        const formats = [...document.querySelectorAll('#formatDropdown input:checked')].map(e => e.value);
        let url = '?sort=' + sort;
        formats.forEach(f => url += '&format=' + f);
        window.location.href = url;
    }
</script>
</body>
</html>
