<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mediatheque — Search</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
    <div class="hd">
        <div>
            <div class="logo">MEDIATHEQUE<span class="logo-dot"></span></div>
            <div class="logo-sub">PHYSICAL MEDIA LIBRARY</div>
        </div>
        <div class="hd-right">
            <form action="/search/results" method="get" style="display:inline;">
                <input class="search-box" name="query" placeholder="SEARCH ALBUM..." th:value="${query}" />
            </form>
        </div>
    </div>

    <div class="nav">
        <a href="/collection" class="nb">COLLECTION</a>
        <a href="/collection/wishlist" class="nb">WISHLIST</a>
    </div>

    <div class="content">
        <div th:if="${hasResults == null}" class="empty-message">
            ENTER ALBUM NAME TO SEARCH DISCOGS DATABASE
        </div>

        <div th:if="${hasResults != null && !hasResults}" class="empty-message">
            NO RESULTS FOUND FOR "<span th:text="${query}">query</span>"
        </div>

        <div th:if="${hasResults != null && hasResults}">

            <details th:if="${!vinyl.isEmpty()}" open>
                <summary class="sort-label" style="cursor:pointer;margin-bottom:12px;">
                    <span>//</span> VINYL <span style="color:#aaa;" th:text="'(' + ${vinyl.size()} + ')'"></span>
                </summary>
                <div class="grid" style="margin-bottom:24px;">
                    <div th:each="album : ${vinyl}" class="card">
                        <div class="card-cover">
                            <div th:if="${album.coverUrl != null && !album.coverUrl.isEmpty()}">
                                <img th:src="${album.coverUrl}" alt="Cover">
                            </div>
                            <div th:if="${album.coverUrl == null || album.coverUrl.isEmpty()}" class="cover-placeholder">
                                <div class="cp-reel"><div class="cp-inner"></div></div>
                            </div>
                        </div>
                        <div class="card-bd">
                            <div class="card-title" th:text="${album.title}">Album</div>
                            <div class="card-artist" th:text="${album.artistName + (album.year != 0 ? ' · ' + album.year : '')}">ARTIST</div>
                            <div class="card-notes" th:text="${album.genre + ' · ' + album.label}">Genre · Label</div>
                            <form th:action="@{/search/add}" method="post" class="card-acts" style="flex-wrap:wrap;gap:6px;">
                                <input type="hidden" name="title" th:value="${album.title}" />
                                <input type="hidden" name="artistName" th:value="${album.artistName}" />
                                <input type="hidden" name="year" th:value="${album.year}" />
                                <input type="hidden" name="genre" th:value="${album.genre}" />
                                <input type="hidden" name="label" th:value="${album.label}" />
                                <input type="hidden" name="discogsId" th:value="${album.discogsId}" />
                                <input type="hidden" name="coverUrl" th:value="${album.coverUrl}" />
                                <input type="hidden" name="format" value="VINYL" />
                                <button type="submit" name="wishlist" value="false" class="btn" style="border-color:#e85d26;color:#e85d26;">+ COLLECTION</button>
                                <button type="submit" name="wishlist" value="true" class="btn">+ WISHLIST</button>
                            </form>
                        </div>
                    </div>
                </div>
            </details>

            <details th:if="${!cassette.isEmpty()}" open>
                <summary class="sort-label" style="cursor:pointer;margin-bottom:12px;">
                    <span>//</span> CASSETTE <span style="color:#aaa;" th:text="'(' + ${cassette.size()} + ')'"></span>
                </summary>
                <div class="grid" style="margin-bottom:24px;">
                    <div th:each="album : ${cassette}" class="card">
                        <div class="card-cover">
                            <div th:if="${album.coverUrl != null && !album.coverUrl.isEmpty()}">
                                <img th:src="${album.coverUrl}" alt="Cover">
                            </div>
                            <div th:if="${album.coverUrl == null || album.coverUrl.isEmpty()}" class="cover-placeholder">
                                <div class="cp-reel"><div class="cp-inner"></div></div>
                            </div>
                        </div>
                        <div class="card-bd">
                            <div class="card-title" th:text="${album.title}">Album</div>
                            <div class="card-artist" th:text="${album.artistName + (album.year != 0 ? ' · ' + album.year : '')}">ARTIST</div>
                            <div class="card-notes" th:text="${album.genre + ' · ' + album.label}">Genre · Label</div>
                            <form th:action="@{/search/add}" method="post" class="card-acts" style="flex-wrap:wrap;gap:6px;">
                                <input type="hidden" name="title" th:value="${album.title}" />
                                <input type="hidden" name="artistName" th:value="${album.artistName}" />
                                <input type="hidden" name="year" th:value="${album.year}" />
                                <input type="hidden" name="genre" th:value="${album.genre}" />
                                <input type="hidden" name="label" th:value="${album.label}" />
                                <input type="hidden" name="discogsId" th:value="${album.discogsId}" />
                                <input type="hidden" name="coverUrl" th:value="${album.coverUrl}" />
                                <input type="hidden" name="format" value="VINYL" />
                                <button type="submit" name="wishlist" value="false" class="btn" style="border-color:#e85d26;color:#e85d26;">+ COLLECTION</button>
                                <button type="submit" name="wishlist" value="true" class="btn">+ WISHLIST</button>
                            </form>
                        </div>
                    </div>
                </div>
            </details>

            <details th:if="${!cd.isEmpty()}" open>
                <summary class="sort-label" style="cursor:pointer;margin-bottom:12px;">
                    <span>//</span> CD <span style="color:#aaa;" th:text="'(' + ${cd.size()} + ')'"></span>
                </summary>
                <div class="grid" style="margin-bottom:24px;">
                    <div th:each="album : ${cd}" class="card">
                        <div class="card-cover">
                            <div th:if="${album.coverUrl != null && !album.coverUrl.isEmpty()}">
                                <img th:src="${album.coverUrl}" alt="Cover">
                            </div>
                            <div th:if="${album.coverUrl == null || album.coverUrl.isEmpty()}" class="cover-placeholder">
                                <div class="cp-reel"><div class="cp-inner"></div></div>
                            </div>
                        </div>
                        <div class="card-bd">
                            <div class="card-title" th:text="${album.title}">Album</div>
                            <div class="card-artist" th:text="${album.artistName + (album.year != 0 ? ' · ' + album.year : '')}">ARTIST</div>
                            <div class="card-notes" th:text="${album.genre + ' · ' + album.label}">Genre · Label</div>
                            <form th:action="@{/search/add}" method="post" class="card-acts" style="flex-wrap:wrap;gap:6px;">
                                <input type="hidden" name="title" th:value="${album.title}" />
                                <input type="hidden" name="artistName" th:value="${album.artistName}" />
                                <input type="hidden" name="year" th:value="${album.year}" />
                                <input type="hidden" name="genre" th:value="${album.genre}" />
                                <input type="hidden" name="label" th:value="${album.label}" />
                                <input type="hidden" name="discogsId" th:value="${album.discogsId}" />
                                <input type="hidden" name="coverUrl" th:value="${album.coverUrl}" />
                                <input type="hidden" name="format" value="VINYL" />
                                <button type="submit" name="wishlist" value="false" class="btn" style="border-color:#e85d26;color:#e85d26;">+ COLLECTION</button>
                                <button type="submit" name="wishlist" value="true" class="btn">+ WISHLIST</button>
                            </form>
                        </div>
                    </div>
                </div>
            </details>

        </div>
    </div>

    <div class="footer">
        <div class="ft">MEDIATHEQUE · <span class="ft-accent">PHYSICAL MEDIA LIBRARY</span></div>
        <div class="ft">DISCOGS API</div>
    </div>
</div>
</body>
</html>
