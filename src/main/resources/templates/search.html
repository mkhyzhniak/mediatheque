<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mediatheque — Search</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/fragments :: header}"></div>
    <div th:replace="~{fragments/fragments :: nav('search')}"></div>

    <div class="content">
        <div th:if="${hasResults == null}" class="empty-message">
            ENTER ALBUM NAME TO SEARCH DISCOGS DATABASE
        </div>

        <div th:if="${hasResults != null && !hasResults}" class="empty-message">
            NO RESULTS FOUND FOR "<span th:text="${query}">query</span>"
        </div>

        <div th:if="${hasResults != null && hasResults}">

            <details th:if="${!vinyl.isEmpty()}" open>
                <summary class="sort-label summary-label">
                    <span>//</span> VINYL <span class="summary-count" th:text="'(' + ${vinyl.size()} + ')'"></span>
                </summary>
                <div class="grid grid-section">
                    <div th:each="album : ${vinyl}" class="card">
                        <div class="card-cover">
                            <div th:if="${album.coverUrl != null && !album.coverUrl.isEmpty()}">
                                <img th:src="${album.coverUrl}" alt="Cover">
                            </div>
                            <div th:if="${album.coverUrl == null || album.coverUrl.isEmpty()}" class="cover-placeholder">
                                <div class="cp-reel"><div class="cp-inner"></div></div>
                            </div>
                        </div>
                        <div class="card-bd">
                            <div class="card-title" th:text="${album.title}"></div>
                            <div class="card-artist" th:text="${album.artistName + (album.year != null && album.year != 0 ? ' · ' + album.year : '')}"></div>
                            <div class="card-notes" th:text="${(album.genre != null ? album.genre : '') + (album.label != null ? ' · ' + album.label : '')}"></div>
                            <form th:action="@{/search/add}" method="post" class="card-acts card-acts-wrap">
                                <input type="hidden" name="title" th:value="${album.title}" />
                                <input type="hidden" name="artistName" th:value="${album.artistName}" />
                                <input type="hidden" name="year" th:value="${album.year}" />
                                <input type="hidden" name="genre" th:value="${album.genre}" />
                                <input type="hidden" name="label" th:value="${album.label}" />
                                <input type="hidden" name="discogsId" th:value="${album.discogsId}" />
                                <input type="hidden" name="coverUrl" th:value="${album.coverUrl}" />
                                <input type="hidden" name="format" th:value="${album.discogsFormat}" />
                                <button type="submit" name="wishlist" value="false" class="btn btn-primary">+ COLLECTION</button>
                                <button type="submit" name="wishlist" value="true" class="btn">+ WISHLIST</button>
                            </form>
                        </div>
                    </div>
                </div>
            </details>

            <details th:if="${!cassette.isEmpty()}" open>
                <summary class="sort-label summary-label">
                    <span>//</span> CASSETTE <span class="summary-count" th:text="'(' + ${cassette.size()} + ')'"></span>
                </summary>
                <div class="grid grid-section">
                    <div th:each="album : ${cassette}" class="card">
                        <div class="card-cover">
                            <div th:if="${album.coverUrl != null && !album.coverUrl.isEmpty()}">
                                <img th:src="${album.coverUrl}" alt="Cover">
                            </div>
                            <div th:if="${album.coverUrl == null || album.coverUrl.isEmpty()}" class="cover-placeholder">
                                <div class="cp-reel"><div class="cp-inner"></div></div>
                            </div>
                        </div>
                        <div class="card-bd">
                            <div class="card-title" th:text="${album.title}"></div>
                            <div class="card-artist" th:text="${album.artistName + (album.year != null && album.year != 0 ? ' · ' + album.year : '')}"></div>
                            <div class="card-notes" th:text="${(album.genre != null ? album.genre : '') + (album.label != null ? ' · ' + album.label : '')}"></div>
                            <form th:action="@{/search/add}" method="post" class="card-acts card-acts-wrap">
                                <input type="hidden" name="title" th:value="${album.title}" />
                                <input type="hidden" name="artistName" th:value="${album.artistName}" />
                                <input type="hidden" name="year" th:value="${album.year}" />
                                <input type="hidden" name="genre" th:value="${album.genre}" />
                                <input type="hidden" name="label" th:value="${album.label}" />
                                <input type="hidden" name="discogsId" th:value="${album.discogsId}" />
                                <input type="hidden" name="coverUrl" th:value="${album.coverUrl}" />
                                <input type="hidden" name="format" th:value="${album.discogsFormat}" />
                                <button type="submit" name="wishlist" value="false" class="btn btn-primary">+ COLLECTION</button>
                                <button type="submit" name="wishlist" value="true" class="btn">+ WISHLIST</button>
                            </form>
                        </div>
                    </div>
                </div>
            </details>

            <details th:if="${!cd.isEmpty()}" open>
                <summary class="sort-label summary-label">
                    <span>//</span> CD <span class="summary-count" th:text="'(' + ${cd.size()} + ')'"></span>
                </summary>
                <div class="grid grid-section">
                    <div th:each="album : ${cd}" class="card">
                        <div class="card-cover">
                            <div th:if="${album.coverUrl != null && !album.coverUrl.isEmpty()}">
                                <img th:src="${album.coverUrl}" alt="Cover">
                            </div>
                            <div th:if="${album.coverUrl == null || album.coverUrl.isEmpty()}" class="cover-placeholder">
                                <div class="cp-reel"><div class="cp-inner"></div></div>
                            </div>
                        </div>
                        <div class="card-bd">
                            <div class="card-title" th:text="${album.title}"></div>
                            <div class="card-artist" th:text="${album.artistName + (album.year != null && album.year != 0 ? ' · ' + album.year : '')}"></div>
                            <div class="card-notes" th:text="${(album.genre != null ? album.genre : '') + (album.label != null ? ' · ' + album.label : '')}"></div>
                            <form th:action="@{/search/add}" method="post" class="card-acts card-acts-wrap">
                                <input type="hidden" name="title" th:value="${album.title}" />
                                <input type="hidden" name="artistName" th:value="${album.artistName}" />
                                <input type="hidden" name="year" th:value="${album.year}" />
                                <input type="hidden" name="genre" th:value="${album.genre}" />
                                <input type="hidden" name="label" th:value="${album.label}" />
                                <input type="hidden" name="discogsId" th:value="${album.discogsId}" />
                                <input type="hidden" name="coverUrl" th:value="${album.coverUrl}" />
                                <input type="hidden" name="format" th:value="${album.discogsFormat}" />
                                <button type="submit" name="wishlist" value="false" class="btn btn-primary">+ COLLECTION</button>
                                <button type="submit" name="wishlist" value="true" class="btn">+ WISHLIST</button>
                            </form>
                        </div>
                    </div>
                </div>
            </details>

        </div>
    </div>

    <div th:replace="~{fragments/fragments :: footer('DISCOGS API')}"></div>
</div>
</body>
</html>
