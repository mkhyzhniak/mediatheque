<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mediatheque — Entry</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="body-centered">
<div class="form-container form-container-sm">
    <div class="form-title">
        <span th:if="${isEdit}">// EDIT ENTRY</span>
        <span th:unless="${isEdit}">// ADD TO COLLECTION</span>
        <div th:if="${error}" class="alert-error" th:text="${error}">
            Error
        </div>
    </div>

    <div th:if="${album != null}" class="form-album-info">
        <div class="card-title" th:text="${album.title}">Album</div>
        <div class="card-artist" th:text="${album.artistName}">Artist</div>
    </div>

    <div th:if="${isEdit}" class="form-album-info">
        <div class="card-title" th:text="${entry.albumTitle}">Album</div>
        <div class="card-artist" th:text="${entry.artistName}">Artist</div>
    </div>

    <form th:if="${isEdit}" th:action="@{'/edit/' + ${entry.id}}" method="post" th:object="${entry}">
        <div class="form-group">
            <label class="form-label">FORMAT</label>
            <div class="form-format-value" th:text="${entry.format}">CASSETTE</div>
            <input type="hidden" th:field="*{format}" />
            <input type="hidden" th:field="*{inWishlist}" />
        </div>

        <div class="form-group">
            <label class="form-label">CONDITION</label>
            <select th:field="*{condition}" class="form-control">
                <option value="">-- SELECT --</option>
                <option th:each="c : ${conditions}" th:value="${c}" th:text="${c}">MINT</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">NOTES</label>
            <textarea th:field="*{notes}" class="form-control" placeholder="Original pressing, limited edition..."></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">DATE ADDED</label>
            <input type="date" th:field="*{addedDate}" class="form-control" />
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">SAVE</button>
            <a href="javascript:history.back()" class="btn">CANCEL</a>
        </div>
    </form>

    <form th:unless="${isEdit}" th:action="@{'/add/' + ${album.id}}" method="post" th:object="${entry}">
        <div class="form-group">
            <label class="form-label">FORMAT</label>
            <div class="form-format-value" th:text="${entry.format}">CASSETTE</div>
            <input type="hidden" th:field="*{format}" />
        </div>

        <div class="form-group">
            <label class="form-label">CONDITION</label>
            <select th:field="*{condition}" class="form-control">
                <option value="">-- SELECT --</option>
                <option th:each="c : ${conditions}" th:value="${c}" th:text="${c}">MINT</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">NOTES</label>
            <textarea th:field="*{notes}" class="form-control" placeholder="Original pressing, limited edition..."></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">DATE ADDED</label>
            <input type="date" th:field="*{addedDate}" class="form-control" />
        </div>

        <input type="hidden" name="inWishlist" value="false" />

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">ADD</button>
            <a href="javascript:history.back()" class="btn">CANCEL</a>
        </div>
    </form>
</div>
</body>
</html>
