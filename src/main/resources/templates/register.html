<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mediatheque — Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="body-light">
<div class="auth-container">
    <div class="auth-title">MEDIATHEQUE<span class="logo-dot"></span></div>
    <div class="auth-subtitle">PHYSICAL MEDIA LIBRARY</div>

    <div class="auth-form-title">// REGISTER</div>

    <div th:if="${error}" class="alert-error" th:text="${error}">
        Error
    </div>

    <form th:action="@{/register}" method="post" th:object="${user}">
        <div class="form-group">
            <label class="form-label">USERNAME</label>
            <input type="text" th:field="*{username}" class="form-control" required />
        </div>

        <div class="form-group">
            <label class="form-label">PASSWORD</label>
            <input type="password" th:field="*{password}" class="form-control" required />
        </div>

        <button type="submit" class="btn btn-primary btn-full">REGISTER</button>
    </form>

    <div class="auth-footer">
        HAVE AN ACCOUNT? <a href="/login" class="auth-link">LOGIN</a>
    </div>
</div>
</body>
</html>
